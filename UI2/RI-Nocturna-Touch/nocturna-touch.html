<!doctype html>
<html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RI Nocturna Touch — Referencia de integración</title><style>body{margin:0;background:#181b20;padding:0}</style></head><body>
<div id="ri-touch-pos">
<style>
#ri-touch-pos{--nt-bg:#181b20;--nt-panel:#24282e;--nt-tile:#2d3239;--nt-border:#414750;--nt-ink:#f3efe9;--nt-muted:#bbb8b3;--nt-copper:#e5b27f;--nt-dark:#2b2118;--nt-select:#48392b;background:var(--nt-bg);color:var(--nt-ink);font:14px 'Segoe UI',sans-serif;border-radius:10px;overflow:hidden}#ri-touch-pos *{box-sizing:border-box}#ri-touch-pos button,#ri-touch-pos input,#ri-touch-pos select{font:inherit}#ri-touch-pos button{min-height:48px;background:var(--nt-tile);color:var(--nt-ink);border:1px solid var(--nt-border);border-radius:7px;padding:8px 12px;touch-action:manipulation}#ri-touch-pos button:disabled{opacity:.45}#ri-touch-pos .nt-top{display:flex;gap:14px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--nt-border)}#ri-touch-pos .nt-logo{color:var(--nt-copper);font-weight:750;font-size:23px}#ri-touch-pos .nt-brand{font-weight:600}#ri-touch-pos .nt-location{color:var(--nt-muted);font-size:12px;margin-left:auto}#ri-touch-pos .nt-shell{display:grid;grid-template-columns:270px minmax(0,1fr);gap:14px;padding:14px}#ri-touch-pos .nt-ticket{background:var(--nt-panel);border:1px solid var(--nt-border);border-radius:9px;display:flex;flex-direction:column;padding:13px;min-width:0}#ri-touch-pos .nt-tickethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}#ri-touch-pos .nt-tickethead strong{font-size:16px}#ri-touch-pos .nt-tickethead span{color:var(--nt-muted);font-size:11px}#ri-touch-pos .nt-tabs{display:flex;gap:5px}#ri-touch-pos .nt-tabs button{flex:1;padding:8px 0}#ri-touch-pos .nt-tabs button[aria-pressed=true]{border-color:var(--nt-copper);background:var(--nt-select);color:var(--nt-copper)}#ri-touch-pos .nt-meta{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:12px 0}#ri-touch-pos .nt-meta select{min-width:0;width:100%;min-height:48px;background:var(--nt-panel);color:var(--nt-ink);border:1px solid var(--nt-border);border-radius:6px;padding:6px;font-size:11px}#ri-touch-pos .nt-client{font-size:12px;color:var(--nt-muted);border-bottom:1px solid var(--nt-border);padding:0 0 11px}#ri-touch-pos .nt-lines{flex:1;min-height:95px}#ri-touch-pos .nt-line{padding:12px 0;border-bottom:1px solid var(--nt-border);display:flex;align-items:center;justify-content:space-between;gap:7px;font-size:12px}#ri-touch-pos .nt-line small{display:block;color:var(--nt-muted);font-size:11px;margin-top:5px}#ri-touch-pos .nt-line button{min-width:44px;min-height:44px;padding:8px;font-size:12px}#ri-touch-pos .nt-total{display:flex;justify-content:space-between;align-items:center;margin:16px 0}#ri-touch-pos .nt-total strong{font-size:27px;font-variant-numeric:tabular-nums;color:var(--nt-copper)}#ri-touch-pos .nt-pay{background:var(--nt-copper);color:var(--nt-dark);border:0;font-weight:650;min-height:55px;width:100%}#ri-touch-pos .nt-tools{display:flex;gap:8px;align-items:center;margin-bottom:10px}#ri-touch-pos .nt-search{width:100%;min-width:0;background:var(--nt-panel);color:var(--nt-ink);border:1px solid var(--nt-border);border-radius:7px;padding:12px;font-size:16px;height:48px}#ri-touch-pos .nt-fav[aria-pressed=true]{background:var(--nt-select);color:var(--nt-copper);border-color:var(--nt-copper)}#ri-touch-pos .nt-category{display:flex;gap:12px;align-items:center;justify-content:space-between;margin:0 0 10px;min-height:27px;font-size:12px;color:var(--nt-muted)}#ri-touch-pos .nt-category strong{color:var(--nt-copper);font-weight:600}#ri-touch-pos .nt-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:7px;align-content:start}#ri-touch-pos .nt-cut{height:64px;min-height:64px;padding:8px 10px;text-align:left;display:flex;flex-direction:column;justify-content:center;gap:5px;min-width:0}#ri-touch-pos .nt-cut b{font-size:13px;font-weight:600;line-height:1.15;overflow-wrap:anywhere}#ri-touch-pos .nt-cut span{font-size:12px;color:var(--nt-copper);font-variant-numeric:tabular-nums}#ri-touch-pos .nt-cut[aria-pressed=true]{background:var(--nt-select);border-color:var(--nt-copper)}#ri-touch-pos .nt-cut:active{background:var(--nt-select)}#ri-touch-pos .nt-status{display:flex;justify-content:space-between;gap:12px;padding:11px 14px;font-size:11px;color:var(--nt-muted);border-top:1px solid var(--nt-border);flex-wrap:wrap}#ri-touch-pos .nt-editor{border:1px solid var(--nt-copper);background:var(--nt-select);border-radius:8px;padding:12px;margin-top:10px}#ri-touch-pos .nt-editor[hidden]{display:none}#ri-touch-pos .nt-editor strong{display:block;margin-bottom:5px;font-size:15px}#ri-touch-pos .nt-editor label{display:block;color:var(--nt-muted);font-size:12px;margin:8px 0}#ri-touch-pos .nt-editor input{width:100%;font-size:25px;min-height:50px;padding:8px;background:var(--nt-bg);color:var(--nt-ink);border:1px solid var(--nt-border);border-radius:6px}#ri-touch-pos .nt-keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:8px 0}#ri-touch-pos .nt-keypad button{font-size:19px;padding:8px}#ri-touch-pos .nt-editoractions{display:flex;gap:6px}#ri-touch-pos .nt-editoractions button{flex:1}#ri-touch-pos .nt-add{background:var(--nt-copper);color:var(--nt-dark);border:0}#ri-touch-pos .nt-message{font-size:11px;color:var(--nt-muted);line-height:1.5;margin-top:10px}#ri-touch-pos .nt-empty{font-size:12px;color:var(--nt-muted);padding:20px 0;line-height:1.5}
@media(min-width:1500px){#ri-touch-pos .nt-grid{grid-template-columns:repeat(auto-fit,minmax(145px,1fr))}#ri-touch-pos .nt-cut{height:70px}#ri-touch-pos .nt-cut b{font-size:15px}#ri-touch-pos .nt-shell{grid-template-columns:310px minmax(0,1fr)}}
@media(max-width:850px){#ri-touch-pos .nt-shell{grid-template-columns:245px minmax(0,1fr);gap:10px;padding:10px}#ri-touch-pos .nt-grid{grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px}#ri-touch-pos .nt-location{display:none}#ri-touch-pos .nt-ticket{padding:10px}#ri-touch-pos .nt-total strong{font-size:23px}}
@media(max-width:580px){#ri-touch-pos .nt-shell{display:flex;flex-direction:column}#ri-touch-pos .nt-main{order:0}#ri-touch-pos .nt-ticket{order:1;min-height:430px}#ri-touch-pos .nt-brand{font-size:12px}#ri-touch-pos .nt-top{gap:8px}#ri-touch-pos .nt-top button{padding:8px;font-size:11px}#ri-touch-pos .nt-grid{grid-template-columns:repeat(3,minmax(0,1fr))}#ri-touch-pos .nt-cut b{font-size:12px}#ri-touch-pos .nt-cut{padding:7px;height:70px}#ri-touch-pos .nt-tools{flex-wrap:wrap}#ri-touch-pos .nt-search{flex:1;min-width:170px}#ri-touch-pos .nt-fav{font-size:12px}}
</style>
<header class="nt-top"><div class="nt-logo">ri</div><span class="nt-brand">NOCTURNA / MOSTRADOR</span><span class="nt-location">Alta Córdoba · Caja B · Ana · Turno abierto</span><button class="nt-account cursor-interaction">Cobrar cuenta</button><button class="nt-menu cursor-interaction" aria-label="Abrir menú"><span aria-hidden="true">☰</span></button></header>
<div class="nt-shell">
<aside class="nt-ticket" aria-label="Ticket de venta"><div class="nt-tickethead"><strong>Venta en curso</strong><span>Mostrador</span></div><div class="nt-tabs" aria-label="Tickets"></div><div class="nt-meta"><select aria-label="Lista de precios"><option>Mostrador</option></select><select aria-label="Comprobante"><option>Ticket no fiscal</option><option>Factura B · demo</option></select></div><div class="nt-client">Consumidor final</div><div class="nt-lines"></div>
<div class="nt-editor" hidden><strong class="nt-selected"></strong><span class="nt-unitprice"></span><label for="nt-kilos">Peso manual de prueba · kg</label><input id="nt-kilos" inputmode="decimal" autocomplete="off" placeholder="0,000"><div class="nt-keypad" aria-label="Teclado de peso"></div><div class="nt-editoractions"><button class="nt-back cursor-interaction">Volver</button><button class="nt-add cursor-interaction">Agregar</button></div></div>
<div class="nt-total"><span>Total</span><strong></strong></div><button class="nt-pay cursor-interaction">Simular cobro →</button><div class="nt-message" role="status" aria-live="polite">Demo · Balanza simulada</div></aside>
<main class="nt-main"><div class="nt-tools"><input class="nt-search" aria-label="Buscar producto o código" placeholder="Buscar o escanear código"><button class="nt-fav cursor-interaction" aria-pressed="false">Favoritos</button></div><div class="nt-category"><strong>Vacuno</strong><span class="nt-count">35 cortes · precio por kg</span></div><div class="nt-grid" aria-label="Cortes vacunos"></div></main>
</div><footer class="nt-status"><span>Productos de prueba · Stock disponible en el detalle</span><span>Sin pagos reales · Impresora sin conectar</span></footer>
<script>
(()=>{const r=document.getElementById('ri-touch-pos'),q=s=>r.querySelector(s);const names=['Aguja','Aguja porc.','Arañita','Azotillo','Bife ancho','Bife angosto','Bife con hueso','Bola de lomo','Colita de cuadril','Costeleta','Cuadrada','Cuadrada feteada','Cuadrada porcionada','Cuadril','Cuadril porcionado','Entraña','Lomo','Marucha','Matambre','Nalga','Nalga feteada','Nalga porcionada','Osobuco','Paleta','Paleta porc.','Palomita','Peceto','Peceto feteado','Peceto porc.','Picaña','Tapa de asado','Tapa de bife','Tapa de nalga','Tortuguita','Vacío'];const prices=[8701,12602,8608,10087,7556,9364,10649,7572,10034,10743,8703,9506,8766,8540,7000,13937,10295,10998,8293,8706,7632,10111,7276,9186,14961,13709,7827,14181,12623,11445,12285,12673,12763,8433,11978];const products=names.map((name,i)=>({name,price:prices[i],id:1001+i}));const fmt=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:2}).format(n);let active=0,pending=null,fav=false;const tickets=[[{...products[4],weight:1.25},{...products[19],weight:.8}],[],[],[]];function catalog(){const search=q('.nt-search').value.toLowerCase().trim();const list=products.filter((p,i)=>(!fav||[4,8,13,15,19,34].includes(i))&&(p.name.toLowerCase().includes(search)||String(p.id)===search));q('.nt-count').textContent=list.length+' cortes · precio por kg';q('.nt-grid').replaceChildren(...list.map(p=>{const b=document.createElement('button');b.className='nt-cut cursor-interaction';b.setAttribute('aria-pressed',String(pending?.id===p.id));b.setAttribute('aria-label',p.name+', '+fmt(p.price)+' por kilogramo');const name=document.createElement('b');name.textContent=p.name;const price=document.createElement('span');price.textContent=fmt(p.price);b.append(name,price);b.onclick=()=>{pending=p;q('.nt-selected').textContent=p.name;q('.nt-unitprice').textContent=fmt(p.price)+' / kg · stock demo: 9999 kg';q('#nt-kilos').value='';q('.nt-editor').hidden=false;q('.nt-message').textContent='Ingresá el peso o usá el teclado táctil.';catalog()};return b}));if(!list.length)q('.nt-grid').textContent='Sin resultados.'}function render(){q('.nt-tabs').replaceChildren(...tickets.map((t,i)=>{const b=document.createElement('button');b.className='cursor-interaction';b.textContent=String.fromCharCode(65+i)+(t.length?' · '+t.length:'');b.setAttribute('aria-pressed',String(i===active));b.onclick=()=>{active=i;close();render()};return b}));q('.nt-lines').replaceChildren(...tickets[active].map((l,i)=>{const div=document.createElement('div');div.className='nt-line';const text=document.createElement('span');text.textContent=l.name;const small=document.createElement('small');small.textContent=l.weight.toLocaleString('es-AR',{minimumFractionDigits:3})+' kg · '+fmt(Math.round(l.price*l.weight*100)/100);text.append(small);const b=document.createElement('button');b.className='cursor-interaction';b.textContent='×';b.setAttribute('aria-label','Quitar '+l.name);b.onclick=()=>{tickets[active].splice(i,1);render()};div.append(text,b);return div}));if(!tickets[active].length)q('.nt-lines').innerHTML='<div class="nt-empty">Tocá un corte para empezar.</div>';q('.nt-total strong').textContent=fmt(tickets[active].reduce((s,l)=>s+Math.round(l.price*l.weight*100),0)/100);q('.nt-pay').disabled=!tickets[active].length||pending!==null}function close(){pending=null;q('.nt-editor').hidden=true;catalog();render()}function add(){const raw=q('#nt-kilos').value.trim();const weight=/^\d+(?:[.,]\d{1,3})?$/.test(raw)?Number(raw.replace(',','.')):NaN;if(!pending||!(weight>0&&weight<=1000)){q('.nt-message').textContent='Ingresá de 0,001 a 1000 kg, con hasta tres decimales.';return}tickets[active].push({...pending,weight});close();q('.nt-message').textContent='Corte agregado. Listo para el siguiente.'}q('.nt-keypad').replaceChildren(...['1','2','3','4','5','6','7','8','9',',','0','⌫'].map(k=>{const b=document.createElement('button');b.className='cursor-interaction';b.textContent=k;b.setAttribute('aria-label',k==='⌫'?'Borrar último dígito':k);b.onclick=()=>{const input=q('#nt-kilos');if(k==='⌫')input.value=input.value.slice(0,-1);else if(k!==','||!/[.,]/.test(input.value))input.value+=k};return b}));q('.nt-add').onclick=add;q('.nt-back').onclick=close;q('#nt-kilos').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();add()}};q('.nt-search').oninput=catalog;q('.nt-search').onkeydown=e=>{if(e.key==='Enter'){const p=products.find(p=>String(p.id)===q('.nt-search').value.trim());if(p){e.preventDefault();const idx=products.filter(p=>!fav||[1005,1009,1014,1016,1020,1035].includes(p.id)).filter(p=>p.name.toLowerCase().includes(q('.nt-search').value.toLowerCase())||String(p.id)===q('.nt-search').value.trim()).findIndex(x=>x.id===p.id);if(idx>=0)q('.nt-grid').children[idx]?.click()}}};q('.nt-fav').onclick=()=>{fav=!fav;q('.nt-fav').setAttribute('aria-pressed',String(fav));catalog()};q('.nt-pay').onclick=()=>{tickets[active]=[];render();q('.nt-message').textContent='Cierre simulado. No se procesó ningún pago.'};q('.nt-account').onclick=()=>q('.nt-message').textContent='Acceso al flujo existente de cobro de cuenta.';q('.nt-menu').onclick=()=>q('.nt-message').textContent='Menú, turno y configuración: conectar al sistema existente.';catalog();render();r.querySelector('.nt-grid').addEventListener('click',()=>{q('.nt-pay').disabled=!!pending});})();
</script>
</div>

</body></html>
