<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Balanza virtual · Carnicerías</title>
  <link rel="stylesheet" href="emulator.css" />
  <script src="../dist/ui/emulator-ui.js" defer></script>
</head>
<body>
  <header><span class="eyebrow">ENTORNO DE DESARROLLO</span><h1>Balanza virtual</h1>
    <p>Inyectá un peso para probar Caja 1. Los tickets ahora se envían por COM1.</p></header>
  <main>
    <section aria-labelledby="scale-title">
      <span class="device-label">BALANZA</span><h2 id="scale-title">Inyectar peso</h2>
      <form id="weight-form">
        <label for="weight">Kilogramos</label>
        <div class="weight-row"><input id="weight" type="number" min="0" max="10000" step="0.001" value="0.750" inputmode="decimal" /><span>kg</span></div>
        <label class="check"><input id="stable" type="checkbox" checked /> Lectura estable</label>
        <button type="submit">Enviar lectura</button>
      </form>
      <p id="status" role="status">Balanza sin lectura estable</p>
    </section>
  </main>
</body>
</html>
